name: AMD-native Vulkan import proof

on:
  push:
    branches:
      - amd/native-inference
    paths:
      - ".github/workflows/vulkan-import-proof.yml"
      - "scripts/ci/**"
      - "corridorkey/**"
  pull_request:
    branches:
      - amd/native-inference
    paths:
      - ".github/workflows/vulkan-import-proof.yml"
      - "scripts/ci/**"
      - "corridorkey/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corridor-model-to-vulkan:
    name: Source models -> MLIR -> Vulkan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only importer and IREE compiler
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.9.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "iree-turbine==3.9.0" "numpy>=1.26,<2"

      - name: Validate versioned checkpoint metadata contract
        shell: bash
        run: python scripts/ci/inspect_checkpoint.py --self-test

      - name: Install software Vulkan device (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # GitHub's Azure mirror can stall mid-download. Prefer the
          # primary Ubuntu archive and retain a fallback for transient errors.
          set_ubuntu_mirror() {
            local host="$1"
            for file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$file" ]; then
                sudo sed -i -E "s#(https?://)(azure\\.archive\\.ubuntu\\.com|us\\.archive\\.ubuntu\\.com|archive\\.ubuntu\\.com)/ubuntu#\\1${host}/ubuntu#g" "$file"
              fi
            done
          }
          apt_install() {
            timeout 120s sudo apt-get update \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15
            timeout 120s sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              libvulkan1 mesa-vulkan-drivers vulkan-tools
          }
          set_ubuntu_mirror archive.ubuntu.com
          if ! apt_install; then
            echo "::warning::Primary Ubuntu mirror failed; trying US archive mirror"
            set_ubuntu_mirror us.archive.ubuntu.com
            apt_install
          fi
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd" || { echo "::error::Mesa lavapipe Vulkan ICD not found"; exit 1; }
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" vulkaninfo --summary

      - name: Import original CorridorKey layers and compile for Vulkan
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python scripts/ci/prove_iree_vulkan.py --output build/vulkan-proof --execute-vulkan --vulkan-target llvmpipe
          else
            python scripts/ci/prove_iree_vulkan.py --output build/vulkan-proof --vulkan-target rdna1
          fi

      - name: Publish proof report and compiler artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-proof-${{ matrix.os }}
          path: build/vulkan-proof/
          if-no-files-found: warn
          retention-days: 7
